<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>THIATHIE Stocks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap">
<style>
*,::before,::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body.dark{--a:#D4FF3C;--bg:#080808;--l1:#101010;--l2:#181818;--l3:#202020;--l4:#2a2a2a;--b0:rgba(255,255,255,.05);--b1:rgba(255,255,255,.09);--b2:rgba(255,255,255,.16);--t0:#fff;--t1:#f0f0f0;--t2:#bbb;--t3:#777;--t4:#444;--grn:#3ddc84;--red:#ff5252}
body.light{--a:#3d8c00;--bg:#f2f2ee;--l1:#fff;--l2:#f5f5f1;--l3:#e8e8e4;--l4:#dcdcd8;--b0:rgba(0,0,0,.06);--b1:rgba(0,0,0,.1);--b2:rgba(0,0,0,.16);--t0:#111;--t1:#222;--t2:#555;--t3:#888;--t4:#aaa;--grn:#2a9a5c;--red:#d94040}
:root{--rr:13px;--rs:8px;--nav:64px}
html{overflow-x:hidden;-webkit-font-smoothing:antialiased}
body{background:var(--bg);color:var(--t0);font-family:"DM Sans",system-ui,sans-serif;font-size:15px;line-height:1.5;min-height:100dvh;padding-bottom:calc(var(--nav)+env(safe-area-inset-bottom)+16px);transition:background .2s,color .2s}
::-webkit-scrollbar{display:none}
input[type=number]{-webkit-appearance:none;-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}

/* HEADER */
.hdr{position:sticky;top:0;z-index:100;height:52px;background:rgba(8,8,8,.93);backdrop-filter:blur(24px);border-bottom:1px solid var(--b0);display:flex;align-items:center;justify-content:space-between;padding:0 16px}
body.light .hdr{background:rgba(242,242,238,.95)}
.brand{display:flex;align-items:center;gap:9px}
.brand-nm{font-family:"Syne",sans-serif;font-size:19px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.brand-nm em{color:var(--a);font-style:normal}
.hdr-r{display:flex;align-items:center;gap:8px}
.hdr-date{font-size:11px;color:var(--t3)}
.theme-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--b1);background:var(--l2);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:transform .1s}
.theme-btn:active{transform:scale(.88)}

/* NAV */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:200;height:calc(var(--nav)+env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:rgba(8,8,8,.97);backdrop-filter:blur(28px);border-top:1px solid var(--b0);display:flex}
body.light .nav{background:rgba(242,242,238,.98)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:none;cursor:pointer;color:var(--t4);font-family:"DM Sans",sans-serif;font-size:8px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:0 2px;transition:color .15s;position:relative}
.nb svg{width:19px;height:19px;stroke-width:1.8}
.nb.on{color:var(--a)}
.nb.on::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:18px;height:2px;background:var(--a);border-radius:0 0 3px 3px}

/* PAGES */
.pg{display:none}
.pg.on{display:block;animation:fadeUp .2s cubic-bezier(.22,1,.36,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.pgh{padding:16px 16px 10px}
.pgh-t{font-family:"Syne",sans-serif;font-size:24px;font-weight:800;text-transform:uppercase;line-height:1}
.pgh-s{font-size:12px;color:var(--t3);margin-top:3px}

/* TABS */
.stabs{display:flex;gap:6px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none}
.stabs::-webkit-scrollbar{display:none}
.stab{flex-shrink:0;padding:7px 13px;border-radius:20px;border:1px solid var(--b1);background:var(--l1);color:var(--t2);font-size:11px;font-weight:600;cursor:pointer;transition:all .12s;white-space:nowrap}
.stab:active{transform:scale(.94)}
.stab.on{background:var(--a);color:#000;border-color:var(--a);font-weight:700}
.stab.new-cat{color:var(--a);border-color:rgba(212,255,60,.25);border-style:dashed}
body.light .stab.new-cat{color:var(--a);border-color:rgba(61,140,0,.25)}

/* PROGRESS */
.prog-wrap{padding:0 16px 14px}
.prog-top{display:flex;justify-content:space-between;font-size:11px;color:var(--t2);margin-bottom:6px}
.prog-bar{height:5px;background:var(--l3);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;background:var(--a);border-radius:3px;transition:width .4s cubic-bezier(.22,1,.36,1)}

/* CATEGORIES */
.cat-sec{margin:0 16px 9px}
.cat-hd{display:flex;align-items:center;justify-content:space-between;padding:12px 13px;background:var(--l1);border:1px solid var(--b0);border-radius:var(--rr);cursor:pointer;user-select:none;transition:background .1s}
.cat-hd:active{background:var(--l2)}
.cat-sec.open .cat-hd{border-radius:var(--rr) var(--rr) 0 0;border-bottom-color:transparent}
.cat-hd-l{display:flex;align-items:center;gap:8px}
.cat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cat-title{font-family:"Syne",sans-serif;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.cat-hd-r{display:flex;align-items:center;gap:10px}
.cat-cnt{font-size:11px;color:var(--t3)}
.chev{color:var(--t3);transition:transform .2s}
.cat-sec.open .chev{transform:rotate(180deg)}
.cat-items{display:none;border:1px solid var(--b0);border-top:none;border-radius:0 0 var(--rr) var(--rr);overflow:hidden;background:var(--l1)}
.cat-sec.open .cat-items{display:block}

/* PRODUCT ROWS */
.prod-row{display:flex;align-items:center;padding:12px 13px;gap:9px;background:var(--l1)}
.prod-row:not(:last-child){border-bottom:1px solid var(--b0)}
.prod-row.ck{opacity:.4}
.prod-row.has-stock{border-left:3px solid var(--grn)}
.chkbox{width:26px;height:26px;border-radius:7px;border:2px solid var(--b2);background:var(--l2);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .12s}
.chkbox:active{transform:scale(.85)}
.chkbox svg{width:13px;height:13px;color:#000;display:none}
.chkbox.on{background:var(--a);border-color:var(--a)}
.chkbox.on svg{display:block}
.prod-info{flex:1;min-width:0}
.prod-nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prod-dt{font-size:10px;color:var(--t3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.need-badge{font-size:10px;color:var(--grn);margin-top:3px;font-weight:600}
.qty-col{display:flex;align-items:center;flex-shrink:0}
.qty-badge{font-family:"Syne",sans-serif;font-size:12px;font-weight:700;color:var(--a)}
.edit-btn{width:30px;height:30px;border-radius:7px;border:1px solid var(--b1);background:var(--l2);color:var(--t3);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .12s}
.edit-btn:active{border-color:var(--a);color:var(--a);transform:scale(.88)}

/* PORTIONS */
.portion-bar-row{display:flex;align-items:center;gap:7px;margin-top:7px}
.portion-bar{flex:1;height:5px;background:var(--l3);border-radius:3px;overflow:hidden}
.portion-fill{height:100%;border-radius:3px;transition:width .3s}
.port-btn{width:30px;height:30px;border-radius:7px;border:1px solid var(--b1);background:var(--l2);color:var(--t1);font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .12s}
.port-btn:active{border-color:var(--a);color:var(--a);transform:scale(.88)}
.port-add{background:rgba(212,255,60,.08);border-color:rgba(212,255,60,.2);color:var(--a)}
.port-unit{font-size:9px;color:var(--t3);white-space:nowrap}

/* RESET BTN */
.reset-btn{display:inline-flex;align-items:center;gap:6px;margin:0 16px 8px;padding:7px 14px;border-radius:20px;border:1px dashed var(--b2);background:var(--l1);color:var(--t3);font-size:11px;font-weight:600;cursor:pointer;transition:all .12s}
.reset-btn:active{border-color:var(--red);color:var(--red)}

/* STOCKS */
.stock-row{display:flex;align-items:center;padding:12px 13px;gap:9px;background:var(--l1)}
.stock-row:not(:last-child){border-bottom:1px solid var(--b0)}
.stock-row.has-stock{background:rgba(61,220,132,.04)}
.frac-ctrl{display:flex;align-items:center;gap:8px;flex-shrink:0}
.frac-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--b1);background:var(--l2);color:var(--t1);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s}
.frac-btn:active{border-color:var(--a);color:var(--a);transform:scale(.88)}
.frac-val{font-family:"Syne",sans-serif;font-size:20px;font-weight:800;color:var(--t3);min-width:28px;text-align:center}
.frac-val.pos{color:var(--grn)}

/* CALENDAR */
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:4px 16px 12px}
.cal-month-t{font-family:"Syne",sans-serif;font-size:18px;font-weight:800}
.cal-nav-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--b1);background:var(--l1);color:var(--t1);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s}
.cal-nav-btn:active{border-color:var(--a);color:var(--a);transform:scale(.88)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:0 16px}
.cal-dh{font-size:10px;font-weight:700;color:var(--t3);text-align:center;padding:3px 0;text-transform:uppercase}
.cal-d{font-size:13px;color:var(--t2);text-align:center;padding:8px 0;border-radius:8px;position:relative}
.cal-d.today{background:var(--a);color:#000;font-weight:800}
.cal-d.sess-d{background:rgba(212,255,60,.08);border:1px solid rgba(212,255,60,.2)}
.cal-dot{width:4px;height:4px;border-radius:50%;background:var(--a);position:absolute;bottom:3px;left:50%;transform:translateX(-50%)}

/* UPCOMING */
.upcoming-card{display:flex;align-items:center;justify-content:space-between;background:var(--l1);border:1px solid var(--b0);border-radius:var(--rr);padding:13px 15px;margin:0 16px 8px}
.upcoming-card.urgent{border-color:rgba(212,255,60,.3);background:rgba(212,255,60,.04)}
.up-name{font-family:"Syne",sans-serif;font-size:15px;font-weight:800}
.up-label{font-size:11px;color:var(--t3);margin-top:2px}
.up-days{font-family:"Syne",sans-serif;font-size:20px;font-weight:800;color:var(--t2)}
.up-days.urg-t{color:var(--a)}
.week-card{background:var(--l1);border:1px solid var(--b0);border-radius:var(--rr);padding:13px 15px;margin:0 16px 8px}

/* BILAN */
.stat4{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.stc{background:var(--l1);border:1px solid var(--b0);border-radius:var(--rr);padding:14px 13px;position:relative;overflow:hidden}
.stc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--a)}
.stc-v{font-family:"Syne",sans-serif;font-size:28px;font-weight:800;color:var(--a);line-height:1}
.stc-u{font-size:9px;color:rgba(212,255,60,.65);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-top:1px}
body.light .stc-u{color:rgba(61,140,0,.8)}
.stc-l{font-size:10px;color:var(--t3);margin-top:5px}
.sess-row{background:var(--l1);border:1px solid var(--b0);border-radius:var(--rr);padding:13px;margin-bottom:8px}
.sess-row-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sess-row-nm{font-family:"Syne",sans-serif;font-size:15px;font-weight:800}
.sess-row-dt{font-size:10px;color:var(--t3);margin-top:2px}
.sess-pct{font-family:"Syne",sans-serif;font-size:20px;font-weight:800}
.sess-prog-bar{height:4px;background:var(--l3);border-radius:2px;overflow:hidden}
.shd-t{font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}

/* ADD / SYNC BTNS */
.add-wrap{padding:4px 16px 14px}
.add-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:7px;padding:12px;background:rgba(212,255,60,.07);border:1px dashed rgba(212,255,60,.28);border-radius:var(--rr);color:var(--a);font-family:"Syne",sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:background .12s}
.add-btn:active{background:rgba(212,255,60,.13)}
.add-btn svg{width:15px;height:15px}
.sync-row{display:flex;gap:8px;padding:0 16px 10px}
.sync-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;background:var(--l1);border:1px solid var(--b1);border-radius:var(--rs);color:var(--t2);font-size:11px;font-weight:600;cursor:pointer;transition:all .12s}
.sync-btn:active{border-color:var(--a);color:var(--a);transform:scale(.97)}
.sync-btn svg{width:13px;height:13px}

/* MODALS */
.mb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:800;align-items:flex-end;justify-content:center}
.mb.show{display:flex}
.ms-sh{background:var(--l1);border:1px solid var(--b2);border-radius:20px 20px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom));width:100%;max-width:520px;animation:su .22s cubic-bezier(.22,1,.36,1);max-height:92dvh;overflow-y:auto}
@keyframes su{from{transform:translateY(36px);opacity:0}to{transform:translateY(0);opacity:1}}
.mp{width:36px;height:4px;background:var(--b2);border-radius:2px;margin:10px auto 16px}
.mt{font-family:"Syne",sans-serif;font-size:19px;font-weight:800;text-transform:uppercase;margin-bottom:14px}
.fg{margin-bottom:10px}
.fl{display:block;font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.fi{width:100%;background:var(--l2);border:1px solid var(--b2);border-radius:var(--rs);color:var(--t0);font-family:"DM Sans",sans-serif;font-size:14px;padding:10px 12px;transition:border-color .12s}
.fi:focus{outline:none;border-color:var(--a)}
.fi-sm{font-size:19px;font-family:"Syne",sans-serif;font-weight:700;text-align:center;padding:9px 5px}
.fr2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fr4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px}
.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.sect-lbl{font-size:10px;font-weight:700;color:var(--a);text-transform:uppercase;letter-spacing:.06em;margin:11px 0 6px;display:block}
body.light .sect-lbl{color:var(--a)}
.mbtns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.mbtns .btn{flex:1;min-width:80px;padding:12px;font-size:13px}
.btn{background:var(--a);color:#000;border:none;border-radius:var(--rr);padding:13px;font-family:"Syne",sans-serif;font-size:14px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;transition:opacity .12s,transform .1s}
.btn:active{opacity:.88;transform:scale(.97)}
.btn.sec{background:var(--l2);color:var(--t0);border:1px solid var(--b2);font-weight:500;font-size:13px;font-family:"DM Sans",sans-serif;text-transform:none;letter-spacing:0}
.btn.danger{background:rgba(255,82,82,.08);color:var(--red);border:1px solid rgba(255,82,82,.18);font-weight:500;font-size:13px;font-family:"DM Sans",sans-serif;text-transform:none;letter-spacing:0;display:none}
.color-dot{width:30px;height:30px;border-radius:7px;cursor:pointer;border:3px solid transparent;transition:border-color .12s;flex-shrink:0}
.color-dot.sel{border-color:var(--t0)}
#colorPicker{display:flex;gap:7px;flex-wrap:wrap;margin-top:4px}

/* CONFIRM */
.cfb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:900;align-items:center;justify-content:center;padding:20px}
.cfb.show{display:flex}
.cf-box{background:var(--l1);border:1px solid var(--b2);border-radius:var(--rr);padding:20px;width:100%;max-width:300px}
.cf-t{font-family:"Syne",sans-serif;font-size:20px;font-weight:800;margin-bottom:6px}
.cf-m{font-size:12px;color:var(--t2);margin-bottom:16px;line-height:1.5}
.cf-btns{display:flex;gap:7px}
.cf-btns .btn{flex:1;padding:11px;font-size:13px}

/* TOAST */
.toast{position:fixed;bottom:calc(var(--nav)+env(safe-area-inset-bottom)+48px);left:50%;transform:translateX(-50%) translateY(10px);background:var(--l4);color:var(--t0);border:1px solid var(--b2);border-radius:24px;padding:8px 16px;font-size:13px;font-weight:500;opacity:0;pointer-events:none;z-index:999;white-space:nowrap;transition:all .22s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{font-size:13px;color:var(--t4);text-align:center;padding:24px 0}
.pad{padding:16px}
</style>
</head>
<body class="dark">

<header class="hdr">
  <div class="brand">
    <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
      <rect width="30" height="30" rx="7" fill="#141414"/>
      <path d="M7 8L7 22L10.5 22L15 14L15 22L18.5 22L18.5 8L15 8L10.5 16L10.5 8Z" fill="#D4FF3C"/>
    </svg>
    <span class="brand-nm">THIA<em>THIE</em></span>
  </div>
  <div class="hdr-r">
    <span class="hdr-date" id="todayDate"></span>
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">&#9728;&#65039;</button>
  </div>
</header>

<!-- CHECK -->
<div class="pg on" id="pg_check">
  <div class="pgh"><div class="pgh-t">Checklist</div><div class="pgh-s" id="checkSub"></div></div>
  <div class="stabs" id="sessTabs"></div>
  <div class="prog-wrap">
    <div class="prog-top"><span id="progLabel">0/0</span><span id="progPct">0%</span></div>
    <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
  </div>
  <div id="resetBtnWrap"></div>
  <div id="catList"></div>
  <div class="add-wrap">
    <div class="add-btn" onclick="openAddProd()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      Ajouter un produit
    </div>
  </div>
</div>

<!-- STOCKS -->
<div class="pg" id="pg_stocks">
  <div class="pgh"><div class="pgh-t">Mon stock</div><div class="pgh-s" id="stockSub"></div></div>
  <div class="stabs" id="stockFilterTabs" style="padding-top:0;padding-bottom:8px"></div>
  <div id="stockList"></div>
  <div class="add-wrap">
    <div class="add-btn" style="border-color:rgba(255,82,82,.3);color:var(--red)" onclick="resetAllStock()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.95"/></svg>
      Remettre tous les stocks &agrave; z&eacute;ro
    </div>
  </div>
</div>

<!-- PRODUITS -->
<div class="pg" id="pg_prods">
  <div class="pgh"><div class="pgh-t">Produits</div><div class="pgh-s">Catalogue complet</div></div>
  <div class="stabs" id="prodTabs"></div>
  <div id="prodList"></div>
  <div class="add-wrap">
    <div class="add-btn" onclick="openAddProd()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      Ajouter un produit
    </div>
  </div>
</div>

<!-- AGENDA -->
<div class="pg" id="pg_agenda">
  <div class="pgh"><div class="pgh-t">Agenda</div><div class="pgh-s">Calendrier des sessions</div></div>
  <div style="margin-top:4px" id="calGrid"></div>
  <div style="padding:12px 16px 6px"><div class="shd-t">Prochaines sessions</div></div>
  <div id="upcomingList"></div>
  <div id="driveReminder"></div>
</div>

<!-- BILAN -->
<div class="pg" id="pg_bilan">

// ── STORAGE ──
function saveAll(){
  try{
    localStorage.setItem("th5_cats",JSON.stringify(cats));
    localStorage.setItem("th5_prods",JSON.stringify(prods));
    localStorage.setItem("th5_checked",JSON.stringify(checked));
    localStorage.setItem("th5_portions",JSON.stringify(portions));
    localStorage.setItem("th5_sessions",JSON.stringify(sessions));
    localStorage.setItem("th5_theme",darkMode?"dark":"light");
    localStorage.setItem("th5_sess",activeSess);
  }catch(e){}
}
function loadAll(){
  var c=localStorage.getItem("th5_cats"); cats=c?JSON.parse(c):JSON.parse(JSON.stringify(DEF_CATS));
  var p=localStorage.getItem("th5_prods"); prods=p?JSON.parse(p):JSON.parse(JSON.stringify(DEF_PRODS));
  var ch=localStorage.getItem("th5_checked"); checked=ch?JSON.parse(ch):{};
  var po=localStorage.getItem("th5_portions"); portions=po?JSON.parse(po):{};
  var s=localStorage.getItem("th5_sessions"); sessions=s?JSON.parse(s):JSON.parse(JSON.stringify(DEF_SESSIONS));
  var th=localStorage.getItem("th5_theme"); if(th) darkMode=(th==="dark");
  var as=localStorage.getItem("th5_sess"); if(as) activeSess=as;
  applyTheme();
}

// ── UTILS ──
function uid(){ return "t"+Date.now()+Math.random().toString(36).slice(2,5); }
function gid(id){ return document.getElementById(id); }
function setH(id,h){ var e=gid(id); if(e) e.innerHTML=h; }
function toast(msg){
  var t=gid("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._t); t._t=setTimeout(function(){ t.classList.remove("show"); },2500);
}
function eur(n){ return (Math.round(n*10)/10)+"\u20ac"; }
function findCat(id){ for(var i=0;i<cats.length;i++) if(cats[i].id===id) return cats[i]; return null; }
function findSess(id){ for(var i=0;i<sessions.length;i++) if(sessions[i].id===id) return sessions[i]; return null; }
function findProd(id){ for(var i=0;i<prods.length;i++) if(prods[i].id===id) return prods[i]; return null; }
function chkKey(sid,pid){ return sid+"_"+pid; }
function isChecked(sid,pid){ return !!checked[chkKey(sid,pid)]; }
function getPortions(sid,pid){ return portions[chkKey(sid,pid)]||0; }
function fracLabel(v){ for(var i=0;i<FRACS.length;i++) if(Math.abs(FRACS[i]-v)<0.01) return FRAC_LABELS[i]; return v+""; }
function fracNext(v){ for(var i=0;i<FRACS.length-1;i++) if(Math.abs(FRACS[i]-v)<0.01) return FRACS[i+1]; return FRACS[FRACS.length-1]; }
function fracPrev(v){ for(var i=FRACS.length-1;i>0;i--) if(Math.abs(FRACS[i]-v)<0.01) return FRACS[i-1]; return 0; }
function getQty(p,sid){
  if(sid==="jan") return p.qtyJan||0; if(sid==="jul") return p.qtyJul||0;
  if(sid==="apr") return p.qtyApr||0; if(sid==="oct") return p.qtyOct||0;
  if(sid==="semaine") return p.qtySem||0; if(sid==="mois") return p.qtyMois||0;
  if(sid==="trimestre") return p.qtyTri||0; return 0;
}
function prodsForSess(sid){ return prods.filter(function(p){ return getQty(p,sid)>0; }); }
function isAlim(sid){ var s=findSess(sid); return s&&(s.type==="alim"); }
function isPortion(p){ return !!(p.portionsTotal&&p.portionsTotal>0); }
function needBuy(p,sid){ return Math.max(0,getQty(p,sid)-(p.stockVal||0)); }

// ── THEME ──
function applyTheme(){
  document.body.className=darkMode?"dark":"light";
  var btn=gid("themeBtn"); if(btn) btn.textContent=darkMode?"\u2600\uFE0F":"\uD83C\uDF19";
}
function toggleTheme(){ darkMode=!darkMode; applyTheme(); saveAll(); }

// ── DETECT NEXT SESSION ──
function detectSess(){
  var m=new Date().getMonth();
  // Always point to the NEXT upcoming big session for visibility
  if(m>=0&&m<6) return "jul";  // Jan→Jun: next big = Juillet
  if(m>=6&&m<12) return "jan"; // Jul→Dec: next big = Janvier
  return "jul";
}

// ── NAVIGATION ──
function go(name){
  document.querySelectorAll(".pg").forEach(function(p){ p.classList.remove("on"); });
  document.querySelectorAll(".nb").forEach(function(b){ b.classList.remove("on"); });
  gid("pg_"+name).classList.add("on");
  gid("nb_"+name).classList.add("on");
  if(name==="check") rCheck();
  else if(name==="stocks") rStocks();
  else if(name==="prods") rProds();
  else if(name==="agenda") rAgenda();
  else if(name==="bilan") rBilan();
}

// ── CHECK ──
function rCheck(){
  var next=detectSess();
  var th="";
  for(var i=0;i<sessions.length;i++){
    var s=sessions[i];
    var label=s.name+(s.id===next&&s.id!==activeSess?" \u2192":"");
    th+="<div class='stab"+(s.id===activeSess?" on":"")+"' onclick=\"setSess('"+s.id+"')\">"+label+"</div>";
  }
  setH("sessTabs",th);
  var sp=prodsForSess(activeSess); var sess=findSess(activeSess);
  var done=0;
  for(var i=0;i<sp.length;i++){
    if(isAlim(activeSess)&&isPortion(sp[i])){ if(getPortions(activeSess,sp[i].id)>=(sp[i].portionsTotal||1)) done++; }
    else if(isChecked(activeSess,sp[i].id)) done++;
  }
  var tot=sp.length; var pct=tot>0?Math.round(done/tot*100):0;
  var missing=0;
  for(var i=0;i<sp.length;i++) if(needBuy(sp[i],activeSess)>0&&!isChecked(activeSess,sp[i].id)) missing++;
  var subLabel=(sess?sess.label:"")+(missing>0?" \u2022 "+missing+"\u00e0 acheter":"");
  setH("checkSub",subLabel);
  setH("progLabel",done+"/"+tot+" articles");
  setH("progPct",pct+"%");
  gid("progFill").style.width=pct+"%";
  gid("progFill").style.background=pct===100?"var(--grn)":"var(--a)";
  setH("resetBtnWrap","<div class='reset-btn' onclick='resetCheck()'>\u21ba Remettre \u00e0 z\u00e9ro la session</div>");
  var listEl=gid("catList"); listEl.innerHTML="";
  for(var ci=0;ci<cats.length;ci++){
    var cat=cats[ci];
    var grp=sp.filter(function(p){ return p.cat===cat.id; });
    if(!grp.length) continue;
    var catDone=0;
    for(var i=0;i<grp.length;i++){
      if(isAlim(activeSess)&&isPortion(grp[i])){ if(getPortions(activeSess,grp[i].id)>=(grp[i].portionsTotal||1)) catDone++; }
      else if(isChecked(activeSess,grp[i].id)) catDone++;
    }
    var sec=document.createElement("div");
    sec.className="cat-sec"+(openCats[cat.id]?" open":""); sec.id="cs_"+cat.id;
    var rows="";
    for(var i=0;i<grp.length;i++){ rows+=buildCheckRow(grp[i]); }
    sec.innerHTML=catHd(cat,catDone,grp.length)+"<div class='cat-items'>"+rows+"</div>";
    listEl.appendChild(sec);
  }
}

function buildCheckRow(p){
  var sid=activeSess; var chk=isChecked(sid,p.id);
  var qty=getQty(p,sid); var stock=p.stockVal||0; var need=needBuy(p,sid);
  var cls="prod-row"+(chk&&!isPortion(p)?" ck":"")+(stock>0?" has-stock":"");
  // Portions mode
  if(isAlim(sid)&&isPortion(p)){
    var pg=getPortions(sid,p.id); var pt=p.portionsTotal||1; var pct2=Math.round(pg/pt*100);
    return "<div class='"+cls+"' style='flex-direction:column;align-items:stretch;padding:11px 13px'>"+
      "<div style='display:flex;align-items:center;gap:9px'>"+
      "<div class='prod-info'><div class='prod-nm'>"+p.name+"</div><div class='prod-dt'>"+p.duration+"</div></div>"+
      "<div class='qty-badge'>"+pg+"/"+pt+"</div>"+
      "<button class='edit-btn' onclick=\"openEditProd('"+p.id+"')\">"+editIcon()+"</button></div>"+
      "<div class='portion-bar-row'>"+
      "<div class='portion-bar'><div class='portion-fill' style='width:"+pct2+"%;background:"+(pct2>=100?"var(--grn)":"var(--a)")+"'></div></div>"+
      "<button class='port-btn port-sub' onclick=\"adjPortion('"+sid+"','"+p.id+"',-1)\">-</button>"+
      "<span class='port-unit'>"+p.unit+"</span>"+
      "<button class='port-btn port-add' onclick=\"adjPortion('"+sid+"','"+p.id+"',1)\">+</button>"+
      "</div></div>";
  }
  var needHtml="";
  if(stock>0) needHtml="<div class='need-badge'>"+(stock>=qty?"\u2705 "+fracLabel(stock)+" en stock \u2014 complet":"\uD83D\uDCE6 "+fracLabel(stock)+" \u2192 acheter "+need)+"</div>";
  return "<div class='"+cls+"'>"+
    "<div class='chkbox"+(chk?" on":"")+"' onclick=\"tglCheck('"+sid+"','"+p.id+"')\">"+
    "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='3' stroke-linecap='round'><polyline points='20 6 9 17 4 12'/></svg></div>"+
    "<div class='prod-info'><div class='prod-nm'>"+p.name+"</div>"+
    "<div class='prod-dt'>"+p.duration+" \u00b7 "+p.where+"</div>"+needHtml+"</div>"+
    "<div class='qty-col'><div class='qty-badge'>\u00d7"+qty+"</div></div>"+
    "<button class='edit-btn' onclick=\"openEditProd('"+p.id+"')\">"+editIcon()+"</button></div>";
}
function catHd(cat,done,tot){
  return "<div class='cat-hd' onclick=\"tglCat('"+cat.id+"')\">"+
    "<div class='cat-hd-l'><div class='cat-dot' style='background:"+cat.color+"'></div>"+
    "<span style='font-size:14px'>"+cat.icon+"</span>"+
    "<span class='cat-title'>"+cat.name+"</span></div>"+
    "<div class='cat-hd-r'><span class='cat-cnt'>"+done+"/"+tot+"</span>"+
    "<svg class='chev' width='15' height='15' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.5' stroke-linecap='round'><polyline points='6 9 12 15 18 9'/></svg></div></div>";
}
function editIcon(){ return "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' width='12' height='12'><path d='M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7'/><path d='M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z'/></svg>"; }

function setSess(id){ activeSess=id; saveAll(); rCheck(); }
function tglCat(id){ openCats[id]=!openCats[id]; var el=gid("cs_"+id); if(el) el.classList.toggle("open"); }
function tglCheck(sid,pid){
  var key=chkKey(sid,pid); if(checked[key]) delete checked[key]; else checked[key]=true;
  saveAll(); rCheck(); if(navigator.vibrate) navigator.vibrate([15]);
}
function adjPortion(sid,pid,d){
  var key=chkKey(sid,pid); var p=findProd(pid); if(!p) return;
  portions[key]=Math.max(0,Math.min(p.portionsTotal||7,(portions[key]||0)+d));
  saveAll(); rCheck(); if(navigator.vibrate) navigator.vibrate([10]);
}
function resetCheck(){
  cfmDlg("Remettre \u00e0 z\u00e9ro ?","Les coches de la session seront effac\u00e9es.",function(){
    Object.keys(checked).forEach(function(k){ if(k.indexOf(activeSess+"_")===0) delete checked[k]; });
    Object.keys(portions).forEach(function(k){ if(k.indexOf(activeSess+"_")===0) delete portions[k]; });
    saveAll(); rCheck(); toast("Session r\u00e9initialis\u00e9e");
  },"R\u00e9initialiser","danger");
}

// ── STOCKS ──
function rStocks(){
  var sess=findSess(activeSess);
  setH("stockSub", sess?"Session de r\u00e9f\u00e9rence : "+sess.name+" \u2022 \u25b2\u25bc pour ajuster":"");
  // Filter tabs
  var tfh="";
  [["all","Tout"],["stocked","En stock"],["needed","\u00c0 acheter"]].forEach(function(opt){
    tfh+="<div class='stab"+(stockFilter===opt[0]?" on":"")+"' onclick='setStockFilter(\""+opt[0]+"\")'>" +opt[1]+"</div>";
  });
  setH("stockFilterTabs",tfh);
  var listEl=gid("stockList"); listEl.innerHTML="";
  for(var ci=0;ci<cats.length;ci++){
    var cat=cats[ci];
    var grp=prods.filter(function(p){ return p.cat===cat.id; });
    if(stockFilter==="stocked") grp=grp.filter(function(p){ return (p.stockVal||0)>0; });
    if(stockFilter==="needed") grp=grp.filter(function(p){ return needBuy(p,activeSess)>0; });
    if(!grp.length) continue;
    var withStock=grp.filter(function(p){ return (p.stockVal||0)>0; }).length;
    var sec=document.createElement("div");
    sec.className="cat-sec open"; sec.id="ss_"+cat.id;
    var rows="";
    for(var i=0;i<grp.length;i++){
      var p=grp[i]; var sv=p.stockVal||0; var nb=needBuy(p,activeSess);
      rows+="<div class='stock-row"+(sv>0?" has-stock":"")+"'>"+
        "<div class='prod-info'><div class='prod-nm'>"+p.name+"</div>"+
        "<div class='prod-dt'>"+fracLabel(sv)+" "+p.unit+(sv>0?"":" \u2014 non stock\u00e9")+"</div>"+
        (nb>0?"<div class='need-badge'>\u2192 acheter "+nb+" "+p.unit+"</div>":"")+
        "</div>"+
        "<div class='frac-ctrl'>"+
        "<button class='frac-btn' onclick=\"adjFrac('"+p.id+"',-1)\">\u25bc</button>"+
        "<div class='frac-val"+(sv>0?" pos":"")+"'>"+fracLabel(sv)+"</div>"+
        "<button class='frac-btn' onclick=\"adjFrac('"+p.id+"',1)\">\u25b2</button>"+
        "</div></div>";
    }
    sec.innerHTML=catHd(cat,withStock,grp.length)+"<div class='cat-items'>"+rows+"</div>";
    listEl.appendChild(sec);
  }
}
function setStockFilter(f){ stockFilter=f; rStocks(); }
function tglStockCat(id){ var el=gid("ss_"+id); if(el) el.classList.toggle("open"); }
function adjFrac(pid,dir){
  var p=findProd(pid); if(!p) return;
  p.stockVal=dir>0?fracNext(p.stockVal||0):fracPrev(p.stockVal||0);
  saveAll(); rStocks(); if(navigator.vibrate) navigator.vibrate([10]);
}
function resetAllStock(){
  cfmDlg("Remettre \u00e0 z\u00e9ro ?","Tous les stocks seront mis \u00e0 0.",function(){
    prods.forEach(function(p){ p.stockVal=0; }); saveAll(); rStocks(); toast("Stocks remis \u00e0 z\u00e9ro");
  },"Confirmer","danger");
}

// ── PRODUITS ──
function rProds(){
  var th="<div class='stab"+(activeCatF==="all"?" on":"")+"' onclick=\"setCatF('all')\">Tous</div>";
  cats.forEach(function(cat){
    th+="<div class='stab"+(activeCatF===cat.id?" on":"")+"' onclick=\"setCatF('"+cat.id+"')\">"+cat.icon+" "+cat.name+"</div>";
  });
  th+="<div class='stab new-cat' onclick='openCatModal()'>+ Cat\u00e9gorie</div>";
  setH("prodTabs",th);
  var fp=activeCatF==="all"?prods:prods.filter(function(p){ return p.cat===activeCatF; });
  var listEl=gid("prodList"); listEl.innerHTML="";
  if(!fp.length){ listEl.innerHTML="<div class='empty'>Aucun produit</div>"; return; }
  if(activeCatF==="all"){
    cats.forEach(function(cat){
      var grp=fp.filter(function(p){ return p.cat===cat.id; }); if(!grp.length) return;
      var sec=document.createElement("div");
      sec.className="cat-sec open"; sec.id="ps_"+cat.id;
      sec.innerHTML=catHd(cat,grp.length,grp.length)+"<div class='cat-items'>"+buildProdRows(grp)+"</div>";
      listEl.appendChild(sec);
    });
  } else {
    listEl.innerHTML="<div class='cat-items' style='border:1px solid var(--b0);border-radius:var(--rr);overflow:hidden'>"+buildProdRows(fp)+"</div>";
  }
}
function buildProdRows(list){
  return list.map(function(p){
    var sv=p.stockVal||0;
    var info="";
    if(p.qtyJan||p.qtyJul) info="Jan:\u00d7"+p.qtyJan+" \u00b7 Jul:\u00d7"+p.qtyJul+(p.qtyApr?" \u00b7 Avr:\u00d7"+p.qtyApr:"");
    else if(p.qtySem) info=p.portionsTotal?p.portionsTotal+" portions/sem":"Hebdo";
    else if(p.qtyMois) info="Mensuel";
    else if(p.qtyTri) info="Trimestriel";
    return "<div class='prod-row"+(sv>0?" has-stock":"")+"' style='border-top:1px solid var(--b0)'>"+
      "<div class='prod-info'><div class='prod-nm'>"+p.name+"</div>"+
      "<div class='prod-dt'>"+info+" \u00b7 "+(p.price>0?eur(p.price)+" \u00b7 ":"")+p.unit+"</div>"+
      "<div class='prod-dt' style='color:var(--t3)'>"+p.where+"</div>"+
      (sv>0?"<div class='need-badge'>\uD83D\uDCE6 "+fracLabel(sv)+" "+p.unit+"</div>":"")+
      "</div>"+
      "<button class='edit-btn' onclick=\"openEditProd('"+p.id+"')\">"+editIcon()+"</button></div>";
  }).join("");
}
function setCatF(id){ activeCatF=id; rProds(); }
function tglCatP(id){ var el=gid("ps_"+id); if(el) el.classList.toggle("open"); }

// ── AGENDA ──
var MONTHS=["Janvier","F\u00e9vrier","Mars","Avril","Mai","Juin","Juillet","Ao\u00fbt","Septembre","Octobre","Novembre","D\u00e9cembre"];
function rAgenda(){
  // Calendar
  var y=calYear; var m=calMonth;
  var first=(new Date(y,m,1).getDay()+6)%7;
  var days=new Date(y,m+1,0).getDate();
  var today=new Date(); var sessM={0:"jan",3:"apr",6:"jul",9:"oct"};
  var ch="<div class='cal-nav'>"+
    "<button class='cal-nav-btn' onclick='calPrev()'>\u2039</button>"+
    "<div class='cal-month-t'>"+MONTHS[m]+" "+y+"</div>"+
    "<button class='cal-nav-btn' onclick='calNext()'>\u203a</button></div>"+
    "<div class='cal-grid'>";
  ["L","M","M","J","V","S","D"].forEach(function(d){ ch+="<div class='cal-dh'>"+d+"</div>"; });
  for(var b=0;b<first;b++) ch+="<div></div>";
  for(var d=1;d<=days;d++){
    var isToday=(d===today.getDate()&&m===today.getMonth()&&y===today.getFullYear());
    var isSess=sessM[m]&&(d===1||d<=3);
    ch+="<div class='cal-d"+(isToday?" today":"")+(isSess?" sess-d":"")+"'>"+d+(isSess?"<div class='cal-dot'></div>":"")+"</div>";
  }
  ch+="</div>"; setH("calGrid",ch);
  // Upcoming
  var now=new Date(); var upcoming=[];
  [{id:"jan",m:0},{id:"apr",m:3},{id:"jul",m:6},{id:"oct",m:9}].forEach(function(x){
    var dt=new Date(now.getFullYear(),x.m,1); if(dt<now) dt.setFullYear(now.getFullYear()+1);
    var days=Math.ceil((dt-now)/86400000);
    var sess=findSess(x.id); if(!sess) return;
    var sp=prodsForSess(x.id); var done=0;
    sp.forEach(function(p){ if(isChecked(x.id,p.id)) done++; });
    upcoming.push({sess:sess,days:days,pct:sp.length?Math.round(done/sp.length*100):0});
  });
  upcoming.sort(function(a,b){ return a.days-b.days; });
  var uh="";
  upcoming.forEach(function(u){
    uh+="<div class='upcoming-card"+(u.days<=30?" urgent":"")+"' onclick=\"setSess('"+u.sess.id+"');go('check');\" style='cursor:pointer'>"+
      "<div><div class='up-name'>"+u.sess.name+"</div><div class='up-label'>"+u.sess.label+" \u00b7 \u279e ouvrir checklist</div></div>"+
      "<div style='text-align:right'><div class='up-days"+(u.days<=30?" urg-t":"")+"'>"+(u.days===0?"Aujourd\u2019hui":u.days===1?"Demain":u.days+" jours")+"</div>"+
      "<div style='font-size:10px;color:var(--t3)'>"+u.pct+"% pr\u00e9par\u00e9</div></div></div>";
  });
  setH("upcomingList",uh);
  // Drive reminder
  var dow=now.getDay(); var dF=(5-dow+7)%7; var dS=(6-dow+7)%7;
  setH("driveReminder","<div class='week-card'><div style='font-size:12px;font-weight:700;color:var(--a);margin-bottom:5px'>Drive alimentaire</div>"+
    "<div style='font-size:13px;color:var(--t2)'>Vendredi dans <strong>"+dF+" j</strong> \u00b7 Samedi dans <strong>"+dS+" j</strong></div>"+
    "<div style='font-size:11px;color:var(--t3);margin-top:3px'>Drive Hyper U \u00b7 ~50\u20ac/sem</div></div>");
}
function calPrev(){ calMonth--; if(calMonth<0){calMonth=11;calYear--;} rAgenda(); }
function calNext(){ calMonth++; if(calMonth>11){calMonth=0;calYear++;} rAgenda(); }

// ── BILAN ──
function rBilan(){
  var tH=0,tA=0,tP=0;
  prods.forEach(function(p){
    var ann=(p.qtyJan+p.qtyJul+p.qtyApr+p.qtyOct)*p.price;
    var alim=(p.qtySem*52+p.qtyMois*12+p.qtyTri*4)*p.price;
    if(p.cat==="parfums") tP+=ann;
    else tH+=ann;
    tA+=alim;
  });
  var stockCount=prods.filter(function(p){ return (p.stockVal||0)>0; }).length;
  setH("bilanStats",
    "<div class='stc'><div class='stc-v'>"+Math.round(tH)+"</div><div class='stc-u'>\u20ac/an</div><div class='stc-l'>Hygi\u00e8ne + entretien</div></div>"+
    "<div class='stc'><div class='stc-v'>"+Math.round(tP)+"</div><div class='stc-u'>\u20ac/an</div><div class='stc-l'>Parfums</div></div>"+
    "<div class='stc'><div class='stc-v'>"+Math.round(tA)+"</div><div class='stc-u'>\u20ac/an</div><div class='stc-l'>Alimentaire estim\u00e9</div></div>"+
    "<div class='stc'><div class='stc-v'>"+stockCount+"</div><div class='stc-u'>produits</div><div class='stc-l'>En stock</div></div>"
  );
  var sh="";
  sessions.forEach(function(s){
    var sp=prodsForSess(s.id); var done=0;
    sp.forEach(function(p){ if(isChecked(s.id,p.id)) done++; });
    var pct=sp.length?Math.round(done/sp.length*100):0;
    var cost=0; sp.forEach(function(p){ cost+=p.price*getQty(p,s.id); });
    sh+="<div class='sess-row'>"+
      "<div class='sess-row-hd'><div><div class='sess-row-nm'>"+s.name+"</div>"+
      "<div class='sess-row-dt'>"+s.label+" \u00b7 "+sp.length+" produits \u00b7 ~"+Math.round(cost)+"\u20ac</div></div>"+
      "<div class='sess-pct' style='color:"+(pct===100?"var(--grn)":"var(--a)")+"'>"+pct+"%</div></div>"+
      "<div class='sess-prog-bar'><div style='height:100%;width:"+pct+"%;background:"+(pct===100?"var(--grn)":"var(--a)")+";border-radius:2px;transition:width .4s'></div></div></div>";
  });
  // Cat breakdown
  var catCosts=[]; var grand=tH+tP+tA;
  cats.forEach(function(cat){
    var cp=prods.filter(function(p){ return p.cat===cat.id; });
    var c=0; cp.forEach(function(p){ c+=p.price*((p.qtyJan+p.qtyJul+p.qtyApr+p.qtyOct)+p.qtySem*52+p.qtyMois*12+p.qtyTri*4); });
    if(c>0.5) catCosts.push({cat:cat,cost:c});
  });
  catCosts.sort(function(a,b){ return b.cost-a.cost; });
  sh+="<div class='shd-t' style='margin:14px 0 10px'>R\u00e9partition</div>";
  catCosts.forEach(function(cc){
    var pct2=Math.round(cc.cost/Math.max(grand,1)*100);
    sh+="<div style='margin-bottom:11px'>"+
      "<div style='display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--t2);margin-bottom:5px'>"+
      "<div style='display:flex;align-items:center;gap:7px'><div class='cat-dot' style='background:"+cc.cat.color+"'></div>"+cc.cat.icon+" "+cc.cat.name+"</div>"+
      "<div style='font-weight:600'>"+Math.round(cc.cost)+"\u20ac/an \u00b7 "+pct2+"%</div></div>"+
      "<div style='height:3px;background:var(--l3);border-radius:2px;overflow:hidden'>"+
      "<div style='height:100%;width:"+pct2+"%;background:"+cc.cat.color+";border-radius:2px'></div></div></div>";
  });
  setH("bilanBody",sh);
}

// ── MODALS PRODUIT ──
function openAddProd(){
  editProdId=null; setH("prodModalT","Nouveau produit");
  ["fProdName","fWhere","fDuration","fUnit"].forEach(function(id){ if(gid(id)) gid(id).value=""; });
  ["fPrice","fQtyJan","fQtyJul","fQtyApr","fQtyOct","fQtySem","fQtyMois","fQtyTri","fPortions"].forEach(function(id){ if(gid(id)) gid(id).value="0"; });
  gid("deleteProdBtn").style.display="none"; fillCatSel(cats[0]?.id);
  gid("prodModal").classList.add("show"); setTimeout(function(){ if(gid("fProdName")) gid("fProdName").focus(); },120);
}
function openEditProd(id){
  var p=findProd(id); if(!p) return; editProdId=id;
  setH("prodModalT","Modifier");
  gid("fProdName").value=p.name; gid("fPrice").value=p.price||0;
  gid("fQtyJan").value=p.qtyJan||0; gid("fQtyJul").value=p.qtyJul||0;
  gid("fQtyApr").value=p.qtyApr||0; gid("fQtyOct").value=p.qtyOct||0;
  gid("fQtySem").value=p.qtySem||0; gid("fQtyMois").value=p.qtyMois||0;
  gid("fQtyTri").value=p.qtyTri||0; gid("fPortions").value=p.portionsTotal||0;
  gid("fWhere").value=p.where||""; gid("fDuration").value=p.duration||""; gid("fUnit").value=p.unit||"";
  gid("deleteProdBtn").style.display="flex"; fillCatSel(p.cat);
  gid("prodModal").classList.add("show");
}
function fillCatSel(selId){
  var sel=gid("fCat"); if(!sel) return; sel.innerHTML="";
  cats.forEach(function(cat){
    var o=document.createElement("option"); o.value=cat.id; o.textContent=cat.icon+" "+cat.name;
    if(cat.id===selId) o.selected=true; sel.appendChild(o);
  });
}
function closeProdModal(){ gid("prodModal").classList.remove("show"); editProdId=null; }
function saveProd(){
  var name=gid("fProdName").value.trim(); if(!name){ toast("Entre un nom"); return; }
  var obj={
    id:editProdId||uid(), cat:gid("fCat").value, name:name,
    price:parseFloat(gid("fPrice").value)||0,
    qtyJan:parseInt(gid("fQtyJan").value)||0, qtyJul:parseInt(gid("fQtyJul").value)||0,
    qtyApr:parseInt(gid("fQtyApr").value)||0, qtyOct:parseInt(gid("fQtyOct").value)||0,
    qtySem:parseInt(gid("fQtySem").value)||0, qtyMois:parseInt(gid("fQtyMois").value)||0,
    qtyTri:parseInt(gid("fQtyTri").value)||0, portionsTotal:parseInt(gid("fPortions").value)||0,
    where:gid("fWhere").value.trim(), duration:gid("fDuration").value.trim(),
    unit:gid("fUnit").value.trim()||"unit\u00e9",
    stockVal:editProdId?(findProd(editProdId)?.stockVal||0):0
  };
  if(editProdId){ prods=prods.map(function(p){ return p.id===editProdId?obj:p; }); toast("Modifi\u00e9 \u2713"); }
  else{ prods.push(obj); toast("Ajout\u00e9 \u2713"); }
  saveAll(); closeProdModal();
  var cur=document.querySelector(".pg.on");
  if(cur){ if(cur.id==="pg_check") rCheck(); else if(cur.id==="pg_stocks") rStocks(); else if(cur.id==="pg_prods") rProds(); else rBilan(); }
}
function deleteProdConfirm(){
  var p=findProd(editProdId); if(!p) return;
  cfmDlg("Supprimer ?",p.name+" sera supprim\u00e9.",function(){
    prods=prods.filter(function(x){ return x.id!==editProdId; });
    saveAll(); closeProdModal(); rProds(); toast("Supprim\u00e9");
  },"Supprimer","danger");
}

// ── MODAL CATÉGORIE ──
var selColor=CAT_COLORS[0];
function openCatModal(){
  gid("fCatName").value=""; gid("fCatIcon").value=""; selColor=CAT_COLORS[0];
  var cp=gid("colorPicker"); cp.innerHTML="";
  CAT_COLORS.forEach(function(col,i){
    var b=document.createElement("div");
    b.className="color-dot"+(i===0?" sel":""); b.style.background=col;
    b.onclick=function(){
      selColor=col; document.querySelectorAll(".color-dot").forEach(function(x){ x.classList.remove("sel"); }); b.classList.add("sel");
    };
    cp.appendChild(b);
  });
  gid("catModal").classList.add("show"); setTimeout(function(){ gid("fCatName").focus(); },120);
}
function closeCatModal(){ gid("catModal").classList.remove("show"); }
function saveCat(){
  var name=gid("fCatName").value.trim(); if(!name){ toast("Entre un nom"); return; }
  cats.push({id:uid(),name:name,color:selColor,icon:gid("fCatIcon").value.trim()||"\uD83D\uDCE6"});
  saveAll(); closeCatModal(); rProds(); toast("Cat\u00e9gorie cr\u00e9\u00e9e \u2713");
}

// ── CONFIRM ──
function cfmDlg(title,msg,cb,okLabel,okClass){
  gid("cfT").textContent=title; gid("cfM").textContent=msg; cfCb=cb;
  var ok=gid("cfOk"); ok.textContent=okLabel||"Supprimer"; ok.className="btn "+(okClass||"danger");
  ok.onclick=function(){ if(cfCb)cfCb(); closeCf(); };
  gid("cfb").classList.add("show");
}
function closeCf(){ gid("cfb").classList.remove("show"); cfCb=null; }

// ── EXPORT / IMPORT ──
function exportData(){
  var d={cats:cats,prods:prods,checked:checked,portions:portions,sessions:sessions};
  var blob=new Blob([JSON.stringify(d,null,2)],{type:"application/json"});
  var url=URL.createObjectURL(blob); var a=document.createElement("a");
  a.href=url; a.download="thiathie_"+new Date().toISOString().slice(0,10)+".json";
  a.click(); URL.revokeObjectURL(url); toast("Export\u00e9 \u2713");
}
function importData(){
  var inp=document.createElement("input"); inp.type="file"; inp.accept=".json";
  inp.onchange=function(e){
    var f=e.target.files[0]; if(!f) return;
    var r=new FileReader(); r.onload=function(ev){
      try{
        var d=JSON.parse(ev.target.result);
        if(d.cats) cats=d.cats; if(d.prods) prods=d.prods;
        if(d.checked) checked=d.checked; if(d.portions) portions=d.portions;
        if(d.sessions) sessions=d.sessions;
        saveAll(); go("check"); toast("Import\u00e9 \u2713");
      }catch(err){ toast("Fichier invalide"); }
    }; r.readAsText(f);
  }; inp.click();
}

loadAll();
for(var _i=0;_i<cats.length;_i++) openCats[cats[_i].id]=true;
if(!localStorage.getItem("th5_sess")) activeSess=detectSess();
rCheck();
(function(){
  var d=new Date(); var el=gid("todayDate");
  if(el) el.textContent=d.toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"});
})();
